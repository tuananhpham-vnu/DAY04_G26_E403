# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Hỏi lại người dùng. Dùng khi THIẾU thông tin bắt buộc để gọi tool khác
      đúng (chưa rõ là tài khoản nào, chưa có URL, ...) — response_type="text".
      Dùng khi cần XÁC NHẬN trước một hành động ghi/gửi (post/send/publish)
      trước khi gọi tool `send` — response_type="yes_no". Dùng response_type="choice"
      kèm `options` khi có danh sách lựa chọn cụ thể để user chọn.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: >
      Lấy các bài đăng (tweet) gần đây của MỘT tài khoản/người cụ thể trên
      Twitter/X. Dùng khi user hỏi tweet/bài đăng CỦA ai đó (vd "tweet mới nhất
      của X"). `screenname` là handle Twitter/X thật (không "@", không phải
      tên đầy đủ) — map tên riêng sang handle quen thuộc khi chắc chắn (vd Sam
      Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy).
      KHÔNG dùng khi user hỏi theo chủ đề (dùng social_search thay vào đó).
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle Twitter/X, vd 'sama', 'elonmusk'"}
        limit: {type: integer, default: 5, description: "Số lượng tweet, lấy đúng số user nêu"}
      required: [screenname]

  - name: social_search
    description: >
      Tìm tweet/bài đăng theo CHỦ ĐỀ hoặc từ khóa trên Twitter/X (không phải
      của một người cụ thể). Dùng khi user hỏi "mọi người đang bàn gì về X",
      "tweet về chủ đề X". `search_type="Top"` khi user muốn bài phổ biến/nổi
      bật/top nhất; `"Latest"` (mặc định) khi muốn mới nhất hoặc không nói rõ.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa/chủ đề"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: Latest=mới nhất, Top=phổ biến"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: >
      Tra cứu/tìm kiếm thông tin trên web nói chung (không phải mạng xã hội).
      `topic="news"` khi hỏi tin tức/thời sự; `"general"` cho tra cứu kiến
      thức khác. `timeframe`: "hôm nay" -> day, "tuần này" -> week (mặc định),
      "tháng này" -> month, "năm nay" -> year. KHÔNG dùng cho câu hỏi về
      tweet/mạng xã hội (dùng social_search/timeline) hay khi đã có URL cụ
      thể (dùng fetch). Khi user hỏi kiểu "Tin tức X hôm nay", hãy rút query
      về một từ khóa ngắn gọn đại diện cho chủ đề chính (ví dụ `AI` thay vì
      cả câu hỏi nguyên vẹn).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "general=kiến thức chung, news=tin tức/thời sự"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: day=hôm nay, week=tuần này"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: >
      Lấy nội dung từ một URL cụ thể mà user đã cung cấp, để đọc/tóm tắt.
      Chỉ dùng khi tin nhắn có URL rõ ràng. Nếu user nhắc "bài này"/"link
      này" nhưng KHÔNG có URL, đừng gọi tool này — gọi `clarify` để hỏi URL
      trước. Nếu có nhiều URL, gọi `fetch` riêng cho từng URL.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL cụ thể cần đọc"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Gửi (post) một đoạn văn bản ra kênh bên ngoài (vd Telegram). Hành động
      ghi, không thể hoàn tác — KHÔNG gọi trực tiếp khi user mới yêu cầu
      "đăng lên..."; phải gọi `clarify` (response_type="yes_no") xin xác
      nhận trước. Chỉ gọi `send` với `confirmed=true` sau khi user đã đồng ý.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: >
      Tìm trong tài liệu chính sách nội bộ công ty. Dùng khi user hỏi về quy
      định nội bộ: trích dẫn nguồn (source_citation), dữ liệu/quyền riêng tư
      (data_privacy), đăng/gửi ra ngoài (external_publishing), nghiên cứu AI
      (ai_research), hoặc cách dùng tool (tool_usage). Chọn `policy_area`
      đúng chủ đề câu hỏi thay vì "all" khi rõ ràng.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
